name: SharkCast Public Feed Relay
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'sharkcast-feed/**'
      - '.github/workflows/sharkcast-feed.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'BU1ST-SharkCast-Relay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh SharkCast feed
        run: python sharkcast-feed/scrape.py
      - name: Commit refreshed feed
        run: |
          git config user.name 'BU1ST SharkCast Relay'
          git config user.email 'actions@users.noreply.github.com'
          git add sharkcast-feed/latest.json
          if git diff --cached --quiet; then
            echo 'No feed change'
          else
            git commit -m 'Refresh SharkCast public feed'
            git push
          fi
