name: Test Public Disaster Dashboard Shark Feeds
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-disaster-shark-feeds.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch public light shark pages
        shell: bash
        run: |
          set -u
          mkdir -p report
          python3 - <<'PY'
          import urllib.request, re, html, os, json
          urls={
            'kiama':'https://emergency.kiama.nsw.gov.au/light/dashboard/sharks',
            'centralcoast':'https://emergency.centralcoast.nsw.gov.au/light/dashboard/sharks',
            'coffs':'https://disaster.coffsharbour.nsw.gov.au/light/dashboard/sharks',
            'sutherland':'https://sutherland.disasterdashboards.com/light/dashboard/sharks',
            'ballina':'https://ballina.disasterdashboards.com/light/dashboard/sharks',
            'lismore':'https://disaster.lismore.nsw.gov.au/light/dashboard/sharks'
          }
          out=[]
          for name,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read().decode('utf-8','replace'); code=r.status
              open(f'report/{name}.html','w',encoding='utf-8').write(raw)
              text=html.unescape(re.sub(r'<[^>]+>',' ',raw)); text=re.sub(r'\s+',' ',text)
              hits=[]
              pats=[r'DPI Fisheries advise:.{0,900}',r'SLSNSW advise.{0,700}',r'Tagged shark detection.{0,1000}',r'SMART drumline.{0,800}']
              for p in pats:
                for m in re.finditer(p,text,re.I): hits.append(m.group(0)[:1200])
              out.append({'name':name,'url':url,'http':code,'bytes':len(raw),'hits':hits[:25],'hit_count':len(hits),'sample':text[:1000]})
            except Exception as e: out.append({'name':name,'url':url,'error':repr(e)})
          open('report/results.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:30000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: disaster-dashboard-shark-feed-test
          path: report/*
